# The one hister instance for every source: code, files and web history,
# selected with type:code, type:file and type:web. Runs the fork at
# github.com/AlexanderReaper7/hister. See ../docs/decisions.md.
app:
  directory: /home/alexander/.local/share/semantic-search/hister
  title: "Search"
  subtitle: ""
  color_scheme: dark
  search_url: https://duckduckgo.com/?q={query}
  redirect_on_no_results: false
server:
  # The Firefox extension posts here by default.
  address: 127.0.0.1:4433
  database: db.sqlite3
indexer:
  detect_languages: true
  max_file_size_mb: 5
  # Files under ~ come after code search works. See ../docs/hister-fork.md.
  directories: []
semantic_search:
  enable: true
  # Through InferMux to the zbox's GTX 1060, and to this host's RTX 3080 when
  # the zbox answers 502, 503 or 504 (nixcfg's failover.yaml, InferMux 0016).
  # The key is HISTER__SEMANTIC_SEARCH__API_KEY, from the same sops secret as
  # the reranker's. Until 2026-10-06 this was the CPU server on :5002 under
  # the name Octen-Embedding-4B, the same GGUF; see ../docs/decisions.md for
  # why the index was kept.
  embedding_endpoint: http://127.0.0.1:5001/v1/embeddings
  embedding_model: Octen-Embedding-4B.Q8_0
  embedding_timeout: 600
  dimensions: 2560
  max_context_length: 1024
  chunk_overlap: 64
  max_embedding_batch_size: 8
  # Octen publishes no prefix. None beat the Qwen3 instruct prefix on a
  # 7-query test over nixcfg modules, 2026-09-26: both 7/7, margin 0.232 vs 0.218.
  query_prefix: ""
  document_prefix: ""
  similarity_threshold: 0.4
  # Filters now apply before ranking, so this no longer has to feed a
  # filter that runs afterwards.
  result_limit: 50
  # A query takes 0.04 s on the zbox. The margin covers a failover: up to 5 s
  # to give up on the zbox, then loading the model on the 3080 after
  # unloading whatever held it. Past 3 s semsearch warns.
  query_embedding_timeout: 30
  semantic_weight: 0.5
  max_embedding_concurrency: 2
  # jina-reranker-v3.5 through InferMux, which loads it on the GPU on demand
  # and evicts a chat model to do so. See ../docs/decisions.md, "Reranking".
  # The key is HISTER__SEMANTIC_SEARCH__RERANK__API_KEY, set by nixcfg's
  # hister unit from a sops secret.
  rerank:
    enable: true
    endpoint: http://127.0.0.1:5001/v1/rerank
    model: jina-reranker-v3.5
    # 30 pieces of 900 characters rerank in 0.36 s once loaded, 30 of 2,000 in
    # 0.89 s (flash-attn, 2026-10-06).
    candidates: 30
    keyword_candidates: 10
    max_document_chars: 2000
    # A cold load is about 4-5 s, plus unloading a chat model first.
    timeout: 15
